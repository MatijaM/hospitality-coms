<!doctype html>
<html lang="%HC_LOCALE%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A magic link's token is in the URL while it is being redeemed, and the
      default referrer policy sends a same-origin URL in full. That puts a
      single-use credential in the Referer of every request the redeem page
      makes. There is nothing on this origin that needs a referrer.
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      Both placeholders are substituted by `vite-plugin-copy.ts` at build time,
      per locale. They are stamped into the shell rather than set by React
      because a screen reader and a browser's translate prompt both read `lang`
      before any script runs, and a title that arrives late shows the wrong one
      in the tab and in history.
    -->
    <title>%HC_APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
